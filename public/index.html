<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทริปโซล–ยออีโด–กังนัม</title>
<meta name="description" content="แผนเที่ยวโซล 5 วัน 4 คืน 12-16 ก.ย. 2569 พร้อมวิธีเดินทางละเอียดและช่องบันทึกค่าใช้จ่ายร่วมกัน">
<meta name="theme-color" content="#FFF6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1828" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="โซลและรอบๆ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Gaegu:wght@700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
:root{
  --paper:#FFF6F2; --card:#FFFFFF; --card2:#FFFBF8;
  --ink:#2E2340; --ink-soft:#6E6382; --ink-faint:#9C93AE;
  --line:#EEDFD8; --line-2:#E2D2CB;
  --seoul:#E4635A; --busan:#2E9AC4; --gold:#E09A2B; --leaf:#5E9F5F; --plum:#9B6BA8;
  --seoul-bg:#FDECEA; --busan-bg:#E6F3F9; --gold-bg:#FCF1DD; --leaf-bg:#E9F3E9; --plum-bg:#F3EAF6;
  --shadow:rgba(70,45,60,.13); --shadow-2:rgba(70,45,60,.07);
  --on-accent:#FFFFFF;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1828; --card:#272134; --card2:#2E2740;
    --ink:#F5EFF7; --ink-soft:#B0A5C4; --ink-faint:#8A7FA0;
    --line:#3A3350; --line-2:#463D5F;
    --seoul:#FF8B84; --busan:#63C4E8; --gold:#F2BE60; --leaf:#8FCE8F; --plum:#C79AD3;
    --seoul-bg:#3B2831; --busan-bg:#1F3542; --gold-bg:#3A3021; --leaf-bg:#243527; --plum-bg:#33263B;
    --shadow:rgba(0,0,0,.45); --shadow-2:rgba(0,0,0,.25);
    --on-accent:#1C1828;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1828; --card:#272134; --card2:#2E2740;
  --ink:#F5EFF7; --ink-soft:#B0A5C4; --ink-faint:#8A7FA0;
  --line:#3A3350; --line-2:#463D5F;
  --seoul:#FF8B84; --busan:#63C4E8; --gold:#F2BE60; --leaf:#8FCE8F; --plum:#C79AD3;
  --seoul-bg:#3B2831; --busan-bg:#1F3542; --gold-bg:#3A3021; --leaf-bg:#243527; --plum-bg:#33263B;
  --shadow:rgba(0,0,0,.45); --shadow-2:rgba(0,0,0,.25);
  --on-accent:#1C1828;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans Thai','Mali',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.65; -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
#root{max-width:520px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'Mali','IBM Plex Sans Thai',cursive;margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--busan);outline-offset:2px;border-radius:8px}
svg{display:block}
.tnum{font-family:'IBM Plex Mono','IBM Plex Sans Thai',monospace;font-variant-numeric:tabular-nums}

/* ---------- hero ---------- */
.hero{padding:18px 4px 6px;position:relative}
.hero-art{width:100%;height:auto;overflow:visible}
.hero h1{font-size:27px;font-weight:700;letter-spacing:-.2px;margin-top:10px}
.hero .sub{color:var(--ink-soft);font-size:13.5px;margin-top:3px}
.hero .stamp{
  position:absolute;right:2px;top:16px;transform:rotate(9deg);
  font-family:'Gaegu','Mali',cursive;font-size:13px;letter-spacing:.5px;
  color:var(--seoul);border:2.5px dashed var(--seoul);border-radius:12px;
  padding:5px 11px 3px;opacity:.85;background:var(--card);
}

/* ---------- day pills ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 12px;scrollbar-width:none;-ms-overflow-style:none}
.pills::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto;border:2px solid var(--line-2);background:var(--card);
  border-radius:14px;padding:7px 13px 6px;display:flex;flex-direction:column;
  align-items:flex-start;min-width:78px;transition:transform .14s,border-color .14s;
}
.pill b{font-family:'Mali',cursive;font-size:15px;font-weight:700;line-height:1.2}
.pill span{font-size:11px;color:var(--ink-faint);letter-spacing:.2px}
.pill[aria-pressed="true"]{border-color:currentColor;transform:translateY(-2px) rotate(-1.2deg);box-shadow:0 5px 0 -1px var(--shadow-2)}
.pill.c-seoul[aria-pressed="true"]{color:var(--seoul);background:var(--seoul-bg)}
.pill.c-busan[aria-pressed="true"]{color:var(--busan);background:var(--busan-bg)}
.pill.c-plum[aria-pressed="true"]{color:var(--plum);background:var(--plum-bg)}
.pill.c-sea[aria-pressed="true"]{color:var(--busan);background:var(--busan-bg)}
.pill.c-leaf[aria-pressed="true"]{color:var(--leaf);background:var(--leaf-bg)}
.pill[aria-pressed="true"] span{color:inherit;opacity:.8}

/* ---------- ticket ---------- */
.ticket{
  background:var(--card);border:2px solid var(--line-2);border-radius:var(--r);
  box-shadow:0 6px 0 -2px var(--shadow-2);overflow:hidden;margin-bottom:16px;
}
.tk-head{padding:14px 16px 13px;position:relative;color:var(--on-accent)}
.tk-head.seoul{background:var(--seoul)}
.tk-head.busan{background:var(--busan)}
.tk-head.plum{background:var(--plum)}
.tk-head.sea{background:var(--busan)}
.tk-head.leaf{background:var(--leaf)}
.tk-head .eyebrow{font-family:'Gaegu',cursive;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;opacity:.85}
.tk-head h2{font-size:20px;font-weight:700;margin-top:1px}
.tk-head .meta{font-size:12.5px;opacity:.9;margin-top:3px}
.perf{height:14px;background:var(--card);position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--line-2)}
.perf::before{left:-8px}
.perf::after{right:-8px}
.perf .dash{position:absolute;left:14px;right:14px;top:6px;border-top:2px dashed var(--line)}

/* ---------- timeline ---------- */
.tl{padding:4px 16px 18px;position:relative}
.tl::before{content:"";position:absolute;left:29px;top:6px;bottom:22px;border-left:2px dotted var(--line-2)}
.ev{position:relative;padding:11px 0 11px 34px}
.ev .dot{
  position:absolute;left:-4px;top:15px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;background:var(--card2);border:2px solid var(--line-2);
  color:var(--ink-soft);
}
.ev.k-spot .dot{background:var(--plum-bg);border-color:var(--plum);color:var(--plum)}
.ev.k-food .dot{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.ev.k-move .dot{background:var(--busan-bg);border-color:var(--busan);color:var(--busan)}
.ev.k-stay .dot{background:var(--leaf-bg);border-color:var(--leaf);color:var(--leaf)}
.ev .time{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;color:var(--ink-faint);letter-spacing:.4px}
.ev h3{font-size:16px;font-weight:600;margin-top:1px}
.ev .kr{font-family:'Gaegu',cursive;font-size:14px;color:var(--ink-faint);margin-left:5px;font-weight:400}
.ev .body{font-size:13.5px;color:var(--ink-soft);margin-top:4px}
.ev .body b{color:var(--ink);font-weight:600}

/* how-to-get-there box */
.route{
  margin-top:9px;border:2px dashed var(--line-2);border-radius:14px;
  background:var(--card2);padding:10px 12px 11px;
}
.route .rt{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  color:var(--busan);letter-spacing:.3px;margin-bottom:6px}
.route ol{margin:0;padding-left:19px;font-size:13px;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px}
.route ol::marker{color:var(--ink-faint)}
.route li b{color:var(--ink);font-weight:600}
.route .rmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{
  font-size:11.5px;font-weight:500;padding:2.5px 9px 1.5px;border-radius:999px;
  background:var(--busan-bg);color:var(--busan);white-space:nowrap;
}
.tag.w{background:var(--gold-bg);color:var(--gold)}
.tag.g{background:var(--leaf-bg);color:var(--leaf)}

.note{
  margin-top:9px;border-radius:13px;padding:9px 12px;font-size:12.8px;
  background:var(--gold-bg);color:var(--ink);border-left:4px solid var(--gold);
}
.note.warn{background:var(--seoul-bg);border-left-color:var(--seoul)}
.note b{font-weight:600}

/* ---------- generic card ---------- */
.card{
  background:var(--card);border:2px solid var(--line-2);border-radius:var(--r);
  box-shadow:0 6px 0 -2px var(--shadow-2);padding:15px 16px 16px;margin-bottom:14px;
}
.card > h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:4px}
.card > h2 .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.card .lead{font-size:13.5px;color:var(--ink-soft);margin-bottom:11px}
.rows{display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:11px;align-items:flex-start;font-size:13.5px}
.row .k{flex:0 0 76px;font-weight:600;font-size:12.5px;color:var(--ink)}
.row .v{color:var(--ink-soft);flex:1}
.row .v b{color:var(--ink);font-weight:600}
.sect-title{
  font-family:'Mali',cursive;font-weight:700;font-size:14px;margin:16px 2px 9px;
  display:flex;align-items:center;gap:8px;color:var(--ink-soft);
}
.sect-title::after{content:"";flex:1;border-top:2px dotted var(--line-2)}

/* ---------- expenses ---------- */
.money{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:500}
.mates{display:flex;gap:10px;margin-bottom:13px}
.mate{
  flex:1;border:2px solid var(--line-2);border-radius:15px;background:var(--card2);
  padding:11px 11px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;
}
.mate.a{border-color:var(--seoul);background:var(--seoul-bg)}
.mate.b{border-color:var(--busan);background:var(--busan-bg)}
.mate input{
  width:100%;text-align:center;background:transparent;border:0;border-bottom:2px dotted var(--line-2);
  font-family:'Mali',cursive;font-weight:700;font-size:15px;padding:1px 0 2px;
}
.mate .amt{font-size:16px}
.mate .lbl{font-size:11px;color:var(--ink-faint)}
.mate .need{font-size:11px;color:var(--ink-soft);margin-top:1px}

.settle{
  border-radius:16px;padding:14px 15px;background:var(--leaf-bg);
  border:2px solid var(--leaf);text-align:center;margin-bottom:14px;
}
.settle .big{font-family:'Mali',cursive;font-weight:700;font-size:19px;line-height:1.45;color:var(--ink)}
.settle .sm{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.settle .big em{font-style:normal;color:var(--leaf)}

.form{display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld > label{font-size:11.5px;font-weight:600;letter-spacing:.3px;color:var(--ink-faint)}
.inp{
  width:100%;background:var(--card2);border:2px solid var(--line-2);border-radius:12px;
  padding:9px 12px;font-size:15px;
}
.inp::placeholder{color:var(--ink-faint)}
.amtrow{display:flex;gap:8px}
.amtrow .inp{flex:1}
.cur{display:flex;border:2px solid var(--line-2);border-radius:12px;overflow:hidden;flex:0 0 auto}
.cur button{padding:0 13px;font-weight:600;font-size:14px;color:var(--ink-faint);background:var(--card2)}
.cur button[aria-pressed="true"]{background:var(--gold);color:#2E2340}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  border:2px solid var(--line-2);background:var(--card2);border-radius:999px;
  padding:5px 12px 4px;font-size:13px;font-weight:500;color:var(--ink-soft);
  transition:transform .12s;
}
.chip[aria-pressed="true"]{color:var(--ink);border-color:currentColor;transform:translateY(-1px)}
.chip.a[aria-pressed="true"]{background:var(--seoul-bg);border-color:var(--seoul);color:var(--seoul)}
.chip.b[aria-pressed="true"]{background:var(--busan-bg);border-color:var(--busan);color:var(--busan)}
.chip.n[aria-pressed="true"]{background:var(--plum-bg);border-color:var(--plum);color:var(--plum)}
.btn{
  border-radius:14px;padding:11px 16px;font-family:'Mali',cursive;font-weight:700;font-size:15.5px;
  background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 0 -1px var(--shadow);transition:transform .1s,box-shadow .1s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 -1px var(--shadow)}
.btn.ghost{background:var(--card2);color:var(--ink-soft);border:2px solid var(--line-2);box-shadow:none;font-size:14px;padding:9px 14px}
.btn[disabled]{opacity:.5;pointer-events:none}

.items{display:flex;flex-direction:column;gap:8px}
.daygrp{display:flex;align-items:center;gap:8px;margin:15px 2px 7px;font-size:12px;font-weight:700;color:var(--ink)}
.daygrp .dcount{font-weight:400;color:var(--ink-faint)}
.daygrp .dsum{margin-left:auto;color:var(--ink-soft)}
.tzhint{margin-top:10px;font-size:11.5px;color:var(--ink-faint);text-align:center}
.sumsheet{margin-top:11px;border:2px dashed var(--line-2);border-radius:16px;background:var(--card2);padding:15px 14px 14px}
.sum-h{font-family:'Mali','IBM Plex Sans Thai',cursive;font-weight:700;font-size:17px;text-align:center;line-height:1.3}
.sum-sub{font-size:11.5px;color:var(--ink-faint);text-align:center;margin-bottom:6px}
.sum-day{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;
  font-weight:700;color:var(--ink);border-top:2px dotted var(--line-2);padding-top:9px;margin-top:11px}
.sum-row{display:flex;gap:9px;align-items:baseline;padding:5px 0;font-size:13px}
.sum-row .sr-t{flex:0 0 38px;font-size:11.5px;color:var(--ink-faint)}
.sum-row .sr-l{flex:1;min-width:0;line-height:1.4}
.sum-row .sr-l em{display:block;font-style:normal;font-size:11px;color:var(--ink-faint)}
.sum-row .sr-v{flex:0 0 auto}
.sum-tot{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14.5px;
  border-top:2px solid var(--line-2);margin-top:13px;padding-top:10px}
.sum-p{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--ink-soft);margin-top:5px}
.sum-p span:first-child{font-weight:600;color:var(--ink);white-space:nowrap}
.sum-p span:last-child{text-align:right}
.sum-net{margin-top:12px;padding:11px 10px;border-radius:13px;background:var(--leaf-bg);
  border:2px solid var(--leaf);color:var(--ink);text-align:center;
  font-family:'Mali','IBM Plex Sans Thai',cursive;font-weight:700;font-size:15px;line-height:1.4}
.sum-net b{color:var(--leaf);font-size:19px}
.item{
  display:flex;align-items:center;gap:10px;background:var(--card2);
  border:2px solid var(--line);border-radius:14px;padding:9px 11px;
}
.item .cdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.item .txt{flex:1;min-width:0}
.item .txt .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .txt .t2{font-size:11.5px;color:var(--ink-faint)}
.item .txt .t2 b{color:var(--ink-soft);font-weight:600}
.item .val{text-align:right;font-size:14px}
.item .val .sub{font-size:11px;color:var(--ink-faint)}
.item .del{padding:4px;color:var(--ink-faint);border-radius:8px;flex:0 0 auto}
.item .del:hover{color:var(--seoul)}
.empty{text-align:center;color:var(--ink-faint);font-size:13.5px;padding:22px 10px}

.bars{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.bar{display:flex;align-items:center;gap:9px;font-size:12.5px}
.bar .bn{flex:0 0 62px;color:var(--ink-soft)}
.bar .track{flex:1;height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;border-radius:99px}
.bar .bv{flex:0 0 auto;font-size:12px;color:var(--ink-soft)}

.syncbar{
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);
  background:var(--card2);border:2px dashed var(--line-2);border-radius:12px;
  padding:8px 11px;margin-bottom:12px;
}
.syncbar .led{width:8px;height:8px;border-radius:50%;background:var(--leaf);flex:0 0 auto}
.syncbar.off .led{background:var(--gold)}
.syncbar.busy .led{background:var(--busan);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--card);border-top:2px solid var(--line-2);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 22px var(--shadow-2);
}
.nav .inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 3px;
  border-radius:13px;color:var(--ink-faint);font-size:10.5px;font-weight:600;letter-spacing:.2px;
}
.nav button[aria-current="true"]{color:var(--seoul);background:var(--seoul-bg)}

/* place actions */
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.act{
  display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line-2);
  background:var(--card2);border-radius:999px;padding:5px 11px 4px;
  font-size:12.5px;font-weight:600;color:var(--ink-soft);transition:transform .12s;
}
.act:active{transform:translateY(1px)}
.act.go{color:var(--busan);border-color:var(--busan);background:var(--busan-bg)}
.act.say{color:var(--plum);border-color:var(--plum);background:var(--plum-bg)}
.act.pic{color:var(--gold);border-color:var(--gold);background:var(--gold-bg)}

/* now marker */
.ev.now{background:var(--gold-bg);border-radius:14px;margin-left:-8px;padding-left:42px;padding-right:10px}
.ev.now .dot{left:4px}
.ev.now .time::after{content:" ← ตอนนี้";color:var(--gold);font-weight:700}
.pill .today{
  display:inline-block;margin-left:5px;font-size:9.5px;font-weight:700;
  background:var(--gold);color:#2E2340;border-radius:99px;padding:1px 6px 0;vertical-align:1px;
}
.countdown{
  display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  background:var(--leaf-bg);color:var(--leaf);border:2px solid var(--leaf);
  border-radius:999px;padding:4px 13px 3px;font-size:12.5px;font-weight:600;
}

/* taxi card */
.sheet{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;
  background:rgba(24,18,34,.62);backdrop-filter:blur(3px)}
.sheet[hidden]{display:none}
.sheet-in{
  background:var(--card);border:3px solid var(--ink);border-radius:22px;
  padding:22px 20px 18px;max-width:420px;width:100%;text-align:center;
  box-shadow:0 12px 0 -4px var(--shadow);
}
.sheet-cap{font-size:12.5px;color:var(--ink-faint);letter-spacing:.3px}
.sheet-kr{
  font-family:'Gaegu','Mali',cursive;font-weight:700;line-height:1.15;
  font-size:clamp(38px,13vw,62px);margin:10px 0 6px;color:var(--ink);word-break:keep-all;
}
.sheet-th{font-size:14.5px;color:var(--ink-soft);margin-bottom:16px}
.sheet-btns{display:flex;gap:9px}
.sheet-btns .btn{flex:1}

/* checklist */
.chk{display:flex;flex-direction:column;gap:7px}
.chk-g{font-size:12px;font-weight:700;color:var(--ink-faint);letter-spacing:.4px;margin:12px 2px 2px}
.chk-g:first-child{margin-top:2px}
.chkitem{
  display:flex;align-items:flex-start;gap:10px;background:var(--card2);
  border:2px solid var(--line);border-radius:13px;padding:9px 11px;text-align:left;width:100%;
}
.chkitem .box{
  flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2.5px solid var(--line-2);
  display:grid;place-items:center;color:transparent;margin-top:1px;
}
.chkitem[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-bg)}
.chkitem[aria-pressed="true"] .box{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chkitem[aria-pressed="true"] .lab{color:var(--ink-faint);text-decoration:line-through}
.chkitem .lab{font-size:13.5px;line-height:1.5}
.chk-bar{display:flex;align-items:center;gap:9px;margin:2px 0 6px;font-size:12.5px;color:var(--ink-soft)}
.chk-bar .track{flex:1;height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.chk-bar .fill{height:100%;background:var(--leaf);border-radius:99px;transition:width .25s}

/* ================= trip clock =================
   Korea runs 2 hours ahead of Thailand, so "today" has to be decided in
   Seoul time or the app flips a day early every evening. */
var TRIP_DATES=['2026-09-12','2026-09-13','2026-09-14','2026-09-15','2026-09-16'];
function kstNow(){
  var p={},f=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',year:'numeric',
    month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
  return {date:p.year+'-'+p.month+'-'+p.day,mins:(+p.hour)*60+(+p.minute)};
}
function tripDayIndex(){var i=TRIP_DATES.indexOf(kstNow().date);return i<0?null:i+1;}
function daysUntilTrip(){
  var a=new Date(kstNow().date+'T00:00:00Z'),b=new Date(TRIP_DATES[0]+'T00:00:00Z');
  return Math.round((b-a)/86400000);
}
function nowSlot(day){
  if(tripDayIndex()!==day)return -1;
  var m=kstNow().mins,ev=DAYS[day-1].ev,at=-1;
  for(var i=0;i<ev.length;i++){
    var p=ev[i].t.split(':');
    if((+p[0])*60+(+p[1])<=m)at=i;
  }
  return at;
}

/* ================= state + sync =================
   Cloudflare build: the shared document lives in D1 behind /api/state.
   Writes carry the version we last read (optimistic concurrency); a poll
   picks up the other person's changes. If /api/state is not deployed the
   whole thing degrades to this-device-only storage. */
var API='/api/state';
var LS='sb-trip-2026';
var PEND='sb-trip-pending';
var POLL_MS=4000;

var state={names:['OATT','POPP'],rate:40,items:[],checks:{}};
var version=0;
var mode='local';       /* local | sync */
var syncState='init';   /* init | ok | busy | slow | error | local */
var inFlight=false;

function stash(op){try{sessionStorage.setItem(PEND,JSON.stringify(op));}catch(e){}}
function dropStash(){try{sessionStorage.removeItem(PEND);}catch(e){}}
function unstash(){var v=null;try{v=JSON.parse(sessionStorage.getItem(PEND)||'null');}catch(e){}dropStash();return v;}

/* Ops are id-based and idempotent, so replaying one that already landed is a
   no-op. That is what makes the conflict retry below safe. */
function applyOp(op,target){
  if(!op)return false;
  var t=target||state,changed=false;
  if(op.add){
    var seen={};t.items.forEach(function(i){seen[i.id]=1;});
    if(!seen[op.add.id]){t.items.push(op.add);changed=true;}
  }
  if(op.del){
    var kept=t.items.filter(function(i){return i.id!==op.del;});
    if(kept.length!==t.items.length){t.items=kept;changed=true;}
  }
  if(op.clear&&t.items.length){t.items=[];changed=true;}
  if(op.check){
    t.checks=t.checks||{};
    var want=!!op.check.on;
    if(!!t.checks[op.check.id]!==want){t.checks[op.check.id]=want;changed=true;}
  }
  if(op.meta){
    if(op.meta.names&&(op.meta.names[0]!==t.names[0]||op.meta.names[1]!==t.names[1])){
      t.names=op.meta.names.slice();changed=true;}
    if(op.meta.rate&&op.meta.rate!==t.rate){t.rate=op.meta.rate;changed=true;}
  }
  return changed;
}

function normalise(d){
  if(!d||typeof d!=='object')d={};
  if(!Array.isArray(d.items))d.items=[];
  if(!Array.isArray(d.names)||d.names.length<2)d.names=['OATT','POPP'];
  if(typeof d.rate!=='number'||!isFinite(d.rate)||d.rate<=0)d.rate=40;
  if(!d.checks||typeof d.checks!=='object')d.checks={};
  return d;
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function loadLocal(){
  try{var raw=localStorage.getItem(LS);if(raw)return normalise(JSON.parse(raw));}catch(e){}
  return null;
}
function sameDoc(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function goLocal(){mode='local';syncState='local';var l=loadLocal();if(l)state=l;}

async function api(method,body){
  var r=await fetch(API,{method:method,
    headers:{'content-type':'application/json'},
    cache:'no-store',
    body:body?JSON.stringify(body):undefined});
  var data=null;
  try{data=await r.json();}catch(e){}
  return {status:r.status,data:data};
}

var ready=(async function(){
  var pend=unstash();
  try{
    var res=await api('GET');
    if(res.status===200&&res.data&&res.data.ok){
      state=normalise(res.data.doc);version=res.data.version|0;
      mode='sync';syncState='ok';
      if(applyOp(pend)){render();await push(pend);return;}
      return;
    }
    goLocal();
  }catch(e){goLocal();}
  if(applyOp(pend))saveLocal();
})();

ready.then(function(){render();if(mode==='sync')startPolling();});

/* Send the whole document guarded by the version we last read. 409 means the
   other person wrote first: take their document, replay our op on top, retry. */
async function push(op,depth){
  depth=depth||0;
  if(mode!=='sync'){saveLocal();render();return;}
  inFlight=true;syncState='busy';render();
  if(op)stash(op);
  try{
    var res=await api('PUT',{doc:state,version:version});
    if(res.status===409&&res.data&&res.data.doc){
      state=normalise(res.data.doc);version=res.data.version|0;
      if(applyOp(op)&&depth<4){inFlight=false;return push(op,depth+1);}
      dropStash();syncState='ok';inFlight=false;render();return;
    }
    if(res.status===200&&res.data&&res.data.ok){
      state=normalise(res.data.doc);version=res.data.version|0;
      dropStash();syncState='ok';inFlight=false;render();return;
    }
    if(res.status===404||res.status===501){
      goLocal();saveLocal();dropStash();inFlight=false;render();return;
    }
    syncState=(res.status===429)?'slow':'error';saveLocal();inFlight=false;render();
  }catch(e){
    syncState='error';saveLocal();inFlight=false;render();
  }
}
function persist(op){return push(op);}

var pollTimer=null;
async function poll(){
  if(mode!=='sync'||inFlight||document.hidden)return;
  try{
    var res=await api('GET');
    if(res.status===200&&res.data&&res.data.ok){
      var v=res.data.version|0;
      if(v!==version){
        var incoming=normalise(res.data.doc);
        version=v;
        if(!sameDoc(incoming,state)){state=incoming;render();}
      }
      if(syncState==='error'||syncState==='slow'){syncState='ok';render();}
    }
  }catch(e){/* offline - keep showing what we have and retry next tick */}
}
function startPolling(){
  if(pollTimer)return;
  pollTimer=setInterval(poll,POLL_MS);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)poll();});
  window.addEventListener('online',poll);
}

/* ---- expenses ---- */
/* Times are shown in Seoul time: the money is spent there, and the app
   already decides "today" that way. Entries saved before timestamps existed
   fall back to the millisecond baked into their id. */
function itemTime(it){
 if(typeof it.ts==='number'&&isFinite(it.ts))return it.ts;
 var n=parseInt(String(it.id||'').slice(1,14),10);
 return isFinite(n)?n:0;
}
var _kf={};
function kstFmt(opts,key){
 if(!_kf[key]){
  opts.timeZone='Asia/Seoul';
  _kf[key]=new Intl.DateTimeFormat(key==='key'?'en-CA':'th-TH',opts);
 }
 return _kf[key];
}
function kstKey(ms){return kstFmt({year:'numeric',month:'2-digit',day:'2-digit'},'key').format(new Date(ms));}
function kstDay(ms){return kstFmt({weekday:'short',day:'numeric',month:'short'},'day').format(new Date(ms));}
function kstClock(ms){return kstFmt({hour:'2-digit',minute:'2-digit',hour12:false},'clock').format(new Date(ms));}

function toTHB(it){return it.cur==='THB'?it.amt:it.amt/state.rate;}
function fmt(n){return n.toLocaleString('th-TH',{maximumFractionDigits:0});}

function calc(){
 var paid=[0,0],owe=[0,0],total=0,bycat={};
 for(var i=0;i<state.items.length;i++){
  var it=state.items[i],v=toTHB(it);
  total+=v;paid[it.payer]+=v;
  bycat[it.cat]=(bycat[it.cat]||0)+v;
  if(it.split==='both'){owe[0]+=v/2;owe[1]+=v/2;}
  else if(it.split==='a')owe[0]+=v;
  else owe[1]+=v;
 }
 return {paid:paid,owe:owe,total:total,bycat:bycat,net:paid[0]-owe[0]};
}

   persist({del:id});
  };
 });
 var cl=document.getElementById('clear');
 if(cl)cl.onclick=function(){
  if(!window.confirm('ลบรายการทั้งหมด? กู้คืนไม่ได้นะ'))return;
  state.items=[];persist({clear:1});
 };
 var cp=document.getElementById('copy');
 if(cp)cp.onclick=function(){
  var txt=summaryText();
  if(navigator.clipboard&&navigator.clipboard.writeText){
   navigator.clipboard.writeText(txt).then(function(){cp.innerHTML=ic('copy',16)+'คัดลอกแล้ว!';setTimeout(render,1400);},function(){window.prompt('คัดลอกข้อความนี้',txt);});
  }else window.prompt('คัดลอกข้อความนี้',txt);
 };
 var sumBtn=document.getElementById('showsum');
 if(sumBtn)sumBtn.onclick=function(){view.showSummary=!view.showSummary;render();
  if(view.showSummary){var el=document.querySelector('.sumsheet');
   if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});}};

 var ss=document.getElementById('saveset');
 if(ss)ss.onclick=function(){
  var r=parseFloat(document.getElementById('rate').value);
  if(isFinite(r)&&r>0){state.rate=1000/r;persist({meta:{names:state.names.slice(),rate:state.rate}});}
 };
}

})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',function(){
  navigator.serviceWorker.register('sw.js').catch(function(){});
});}
</script>
</body>
</html>
